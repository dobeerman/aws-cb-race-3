name: Feature Request
description: Describe a change with testable acceptance criteria
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Context
      description: Who has the problem and why does it matter?
      placeholder: Describe the current problem, not an implementation.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: Describe observable behavior after the change.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Provide concrete, independently verifiable outcomes.
      placeholder: "- Given ..., when ..., then ..."
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Technical Constraints
      description: Optional compatibility, security, or architecture constraints.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Optional examples, references, or screenshots.
    validations:
      required: false
